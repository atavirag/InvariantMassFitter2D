input:
  #filename: ~/Codigo/Analysis/Double-D/InvariantMassFitter2D/data/efficiencies/Eff_times_Acc_Map_weighted.root
  filename: ~/Codigo/Analysis/Double-D/InvariantMassFitter2D/data/AnalysisResults/AnalysisResults_MC_cutsMingyu.root
  treename: hf-task-d0/
  histoname:
    #reconstructed:
    #  All: hPtVsYRecoWeighted
    #  Prompt: hPtVsYRecoWeightedPrompt
    #  Nonprompt: hPtVsYRecoWeightedNonPrompt
    #generated:
    #  All: hPtVsYGenWeighted
    #  Prompt: hPtVsYGenWeightedPrompt
    #  Nonprompt: hPtVsYGenWeightedNonPrompt
    reconstructed:
      All: hPtVsYRecSigReco
      Prompt: hPtVsYRecSigPromptReco
      Nonprompt: hPtVsYRecSigNonPromptReco
    generated:
      All: hPtVsYGen
      Prompt: hPtVsYGenPrompt
      Nonprompt: hPtVsYGenNonPrompt

pt_bins_limits: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 16, 24] # options available: list of bin limits, null to deactivate

rapidity:
  axis: Y # rapidity axis in input histograms, options available: X, Y
  cut: 0.5 # selection |y| < cut on the generated histogram, null if not cut

output:
  dir: ./
  save:
    TEfficiency: True # save TEfficiency instances in output .root file
    TH1: True # save TH1 histograms in output .root file
    TCanvas: # save TCanvas instances in extra files (on top of the standard output .root file)
      individual: True # for individual canvas (All, Prompt, Nonprompt separately)
      overlap: True # for overlap canvas (see overlap entry below)
      extension: pdf, png # root not needed, all canvas are stored in .root file anyway
  plots:
    label: AccEffD0ToKPi_cutsMingyu # label in output files (file names, .root entries)
    y_axis:
      name: "(Acc. #times #varepsilon)"
      min: 1.e-3
      max: 1.
      log_scale: True
    overlap: Prompt, Nonprompt # options available: All, Prompt, Nonprompt, null (if not overlap wanted)
    watermark: "ALICE Work in progress" # watermark on top left of the plot's frame
